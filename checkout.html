<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Checkout</h2>
        <div class="cart-items">
            <div class="cart-item">
                <img src="./Img/Pepperoni Pizza.jpg" alt="Pizza">
                <span>Pepperoni Pizza</span>
                <span>$12.99</span>
                <span>Qty: 2</span>
            </div>
            <div class="cart-item">
                <img src="./Img/Mushroom Pizza.jpg" alt="Pizza">
                <span>Mushroom Pizza</span>
                <span>$10.99</span>
                <span>Qty: 1</span>
            </div>
        </div>
        <div class="order-summary">
            <p>Subtotal: $36.97</p>
            <p>Tax: $2.99</p>
            <p class="total">Total: $39.96</p>
        </div>
        <button class="checkout-btn">Proceed to Payment</button>
    </div>
</body>
</html>
