<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

</head>
<body>
    <div class="container">
        <h2>Checkout</h2>
        <div class="cart-items">
            <div class="cart-item">
                <img src="pizza1.jpg" alt="Pizza">
                <span>Pepperoni Pizza</span>
                <span>$12.99</span>
                <span>Qty: 2</span>
            </div>
            <div class="cart-item">
                <img src="pizza2.jpg" alt="Pizza">
                <span>Mushroom Pizza</span>
                <span>$10.99</span>
                <span>Qty: 1</span>
            </div>
        </div>
        <div class="order-summary">
            <p>Subtotal: $36.97</p>
            <p>Tax: $2.99</p>
            <p class="total">Total: $39.96</p>
        </div>
        <button class="checkout-btn">Proceed to Payment</button>
    </div>
</body>
</html>
